<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="flashcard-body">
    <nav class="navbar custom-nav sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="images/icon.png" alt="Logo" width="40" class="me-2" />
          <span class="brand-font">Study Bunny</span>
        </a>
      </div>
    </nav>
    <div class="container py-5">
      <div class="row align-items-center">
        <div class="col-lg-6 text-center mb-5 mb-lg-0">
          <div class="avatar-window shadow-lg mx-auto">
            <img
              src="images/yay.jpg"
              id="base-layer"
              class="bunny-layer"
              alt="Bunny Base"
            />
            <img src="" id="clothes-layer" class="bunny-layer" alt="" />
            <img src="" id="hat-layer" class="bunny-layer" alt="" />
          </div>
          <h2 class="brand-font mt-4" id="greeting">Hello, Bunny!</h2>
          <button
            class="btn btn-bunny px-4 rounded-pill mt-2"
            onclick="saveBunny()"
          >
            Save Look
          </button>
        </div>

        <div class="col-lg-6">
          <div class="card p-4 border-0 rounded-5 shadow-sm">
            <h3 class="brand-font text-center mb-4">The Bunny Closet</h3>

            <ul class="nav nav-pills nav-fill mb-4" id="closetTabs">
              <li class="nav-item">
                <button
                  class="nav-link active"
                  onclick="showCategory('clothes')"
                >
                  Outfits
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link" onclick="showCategory('hats')">
                  Accessories
                </button>
              </li>
            </ul>

            <div id="clothes-options" class="closet-grid">
              <div
                class="item-slot"
                onclick="setLayer('clothes', 'images/1.png')"
              >
                <img src="images/1.png" alt="Outfit 1" />
              </div>
              <div
                class="item-slot"
                onclick="setLayer('clothes', 'images/2.png')"
              >
                <img src="images/2.png" alt="Outfit 2" />
              </div>
              <div
                class="item-slot"
                onclick="setLayer('clothes', 'images/3.png')"
              >
                <img src="images/3.png" alt="Outfit 3" />
              </div>
              <div
                class="item-slot"
                onclick="setLayer('clothes', 'images/4.png')"
              >
                <img src="images/4.png" alt="Outfit 4" />
              </div>
              <div class="item-slot" onclick="setLayer('clothes', '')">❌</div>
            </div>

            <div id="hats-options" class="closet-grid d-none">
              <div class="item-slot" onclick="setLayer('hat', 'images/5.png')">
                <img src="images/5.png" alt="accessory 1" />
              </div>
              <div class="item-slot" onclick="setLayer('hat', 'images/6.png')">
                <img src="images/6.png" alt="accessory 2" />
              </div>
              <div class="item-slot" onclick="setLayer('hat', '')">❌</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="custom-footer">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-4 text-center text-md-start mb-4 mb-md-0">
            <a href="index.html" class="footer-logo">
              <img src="images/icon.png" alt="Logo" width="30" class="me-2" />
              Study Bunny
            </a>
            <p class="small mt-2">
              Making study time a little more "hoppy" since 2024.
            </p>
          </div>

          <div class="col-md-4 text-center mb-4 mb-md-0">
            <div class="d-flex justify-content-center gap-3">
              <a href="index.html" class="footer-link">Home</a>
              <a href="about.html" class="footer-link">About</a>
              <a href="avatar.html" class="footer-link">Avatar</a>
            </div>
          </div>

          <div class="col-md-4 text-center text-md-end">
            <div class="social-icons mb-2">
              <a href="#"><i class="fab fa-instagram"></i></a>
              <a href="#"><i class="fab fa-tiktok"></i></a>
              <a href="#"><i class="fab fa-github"></i></a>
            </div>
            <p class="small mb-0">
              &copy; <span id="year"></span> BunnyBurrow. Created with Love and
              Carrots.
            </p>
          </div>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
